<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>GawJaay</title>
    <!--
      GitHub Pages ne sait pas réécrire les routes d'une SPA : toute URL profonde
      renvoie ce fichier 404. On restaure la route demandée dans l'index pour que
      /app, /marketplace, /shop/... fonctionnent aussi au rechargement direct.
    -->
    <script>
      (function () {
        var segmentsToKeep = 1; // /Gawjaay/
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') +
            '/?/' +
            l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash,
        );
      })();
    </script>
  </head>
  <body></body>
</html>
