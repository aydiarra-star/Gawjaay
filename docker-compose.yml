version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: gawjaay
      POSTGRES_USER: gawjaay
      POSTGRES_PASSWORD: gawjaay_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  pgdata:
