<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF6A14" />
    <title>GawJaay — Vendre vite. Gérer mieux.</title>
    <meta
      name="description"
      content="GawJaay : plateforme de gestion commerciale pour les commerçants du Sénégal — produits, stock, ventes, clients, commandes et marketplace."
    />
    <meta property="og:title" content="GawJaay — Vendre vite. Gérer mieux." />
    <meta
      property="og:description"
      content="Gérez produits, stock, ventes, clients et commandes, en boutique comme en ligne."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Configuration d'exécution : permet de pointer l'API sans reconstruire (voir config.js). -->
    <script src="./config.js"></script>
    <script>
      // Restaure la route transmise par 404.html (GitHub Pages, SPA).
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
