name: Commerce validation 2026

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run typecheck -w @gawjaay/api
      - run: npm run typecheck -w @gawjaay/web
      - run: npm test
