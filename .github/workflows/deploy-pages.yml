name: Deploy GawJaay web

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: gawjaay-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: production
      VITE_BASE_PATH: /Gawjaay/
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Build shared package
        run: npm run build -w @gawjaay/shared

      - name: Build production web
        run: npm run build:web

      - name: Add and validate runtime API configuration
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const raw = process.env.VITE_API_URL?.trim();
          if (!raw) {
            throw new Error('GitHub Actions repository variable VITE_API_URL is required. Set it to the real HTTPS API URL ending in /api/v1.');
          }
          let url;
          try {
            url = new URL(raw);
          } catch {
            throw new Error('VITE_API_URL is not a valid URL.');
          }
          const host = url.hostname.toLowerCase();
          const localHost = host === 'localhost' || host.endsWith('.localhost') || ['127.0.0.1', '::1', '[::1]'].includes(host);
          const privateIpv4 = /^(10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|169\\.254\\.)/.test(host);
          if (url.protocol !== 'https:' || !host || localHost || privateIpv4 || url.username || url.password) {
            throw new Error('VITE_API_URL must use HTTPS, a public host, and no embedded credentials.');
          }
          const apiPath = url.pathname.endsWith('/') ? url.pathname.slice(0, -1) : url.pathname;
          if (!apiPath.endsWith('/api/v1') || url.search || url.hash) {
            throw new Error('VITE_API_URL must end in /api/v1 and must not include a query string or fragment.');
          }
          const apiUrl = url.toString().endsWith('/') ? url.toString().slice(0, -1) : url.toString();
          writeFileSync('apps/web/dist/config.js', 'window.__GAWJAAY_CONFIG__ = { apiUrl: ' + JSON.stringify(apiUrl) + ' };' + String.fromCharCode(10), 'utf8');
          console.log('Runtime API configured for ' + url.host + '.');
          NODE

      - name: Publish to gh-pages
        run: |
          set -e
          git fetch origin gh-pages --depth=1
          rm -rf .gh-pages-work
          git worktree add -f .gh-pages-work origin/gh-pages
          find .gh-pages-work -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R apps/web/dist/. .gh-pages-work/
          cd .gh-pages-work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment changes."
            exit 0
          fi
          git commit -m "deploy(web): publish main"
          git push origin HEAD:gh-pages

# Deployment is intentionally sourced from main and publishes the complete built SPA to gh-pages.
