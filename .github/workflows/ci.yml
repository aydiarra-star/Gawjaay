name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build shared package
        run: npm run build:shared
      - name: Generate Prisma client
        run: npm run db:generate -w @gawjaay/api
      - name: Typecheck API
        run: npm run typecheck -w @gawjaay/api
      - name: Run API tests
        run: npm test

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build shared package
        run: npm run build:shared
      - name: Typecheck web
        run: npm run typecheck -w @gawjaay/web
      - name: Build web
        run: npm run build:web

  e2e:
    name: E2E (Playwright, desktop + mobile)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build shared package
        run: npm run build:shared
      - name: Generate Prisma client and prepare database
        run: |
          npm run db:generate -w @gawjaay/api
          DATABASE_URL="file:./prisma/dev.db" npm run db:push -w @gawjaay/api
      - name: Build API
        run: npm run build:api
      - name: Build web
        run: npm run build:web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run E2E tests
        run: npm run test:e2e
