name: GawJaay CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gawjaay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Run API tests
        run: npm test

      - name: Build production applications
        run: npm run build

      - name: Verify generated frontend bundle
        run: npm run verify:bundle -w @gawjaay/web
