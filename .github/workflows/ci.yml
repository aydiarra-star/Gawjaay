name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build shared package
        run: npm run build:shared
      - name: Generate Prisma client
        run: npm run db:generate -w @gawjaay/api
      - name: Typecheck API
        run: npm run typecheck -w @gawjaay/api
      - name: Run API tests
        run: npm test

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build shared package
        run: npm run build:shared
      - name: Typecheck web
        run: npm run typecheck -w @gawjaay/web
      - name: Build web
        run: npm run build:web
